name: Ingest Deriva

on:
  workflow_dispatch:
  push:
    paths:
      - "config/sources.json"
      - "ingest/test_feeds.py"
      - "ingest/ingest.py"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Probar los feeds
        run: python ingest/test_feeds.py

      - name: Ingestar artículos
        run: python ingest/ingest.py

      - name: Mostrar resultado
        run: |
          echo "Contenido de data/articles.json:"
          python -m json.tool data/articles.json | head -80

      - name: Auditar categorías
        run: python ingest/audit_categories.py

      - name: Guardar articles.json en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/articles.json

          if git diff --cached --quiet; then
            echo "No hay cambios en articles.json"
          else
            git commit -m "Actualizar artículos de Deriva"
            git push
          fi
